<div class="card project-card h-100">

    <img [src]="project.image" class="card-img-top" [alt]="project.title">

    <div class="card-body">

        <h4>{{project.title}}</h4>

        <p>

            {{project.description}}

        </p>

        <div class="mb-3">

            @for (tech of project.technologies; track tech){

            <app-technology-badge [technology]="tech">
            </app-technology-badge>

            }

        </div>

        <div class="buttons">

            <a class="btn btn-primary" [href]="project.github" target="_blank">

                <i class="fab fa-github"></i>

                GitHub

            </a>

            <a class="btn btn-outline-primary" [href]="project.demo" target="_blank">

                Live Demo

            </a>

        </div>

    </div>

</div>
